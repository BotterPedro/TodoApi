services:
  postgres:
    image: postgres:16
    container_name: todoapi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todoapi
    ports:
      - "5432:5432"
    volumes:
      - todoapi-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  todoapi-pgdata: